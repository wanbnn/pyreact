name: Test and publish PyReact

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,e2e]" build twine

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run framework tests
        run: python -m pytest -q

      - name: Run boilerplate tests
        working-directory: boilerplate
        run: python -m pytest -q

      - name: Generate unique PyPI version
        id: version
        shell: bash
        run: |
          version="$(python scripts/set_ci_version.py \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building pyreact-framework ${version}"

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: pyreact-framework-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyreact-framework/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: pyreact-framework-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

