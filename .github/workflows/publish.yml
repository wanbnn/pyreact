name: Test, build and publish PyReact

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish package to PyPI after tests and build"
        required: true
        type: boolean
        default: true

concurrency:
  group: pyreact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run tests and enforce coverage
        run: python -m pytest -q --cov=pyreact --cov-report=term-missing --cov-fail-under=95

  browser:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test generated project in a browser
        run: python -m pytest -q tests/e2e
      - name: Test boilerplate, including browser flow
        working-directory: boilerplate
        run: python -m pytest -q

  build:
    name: Build distributions
    needs: [test, browser]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - name: Read package version
        id: version
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="${{ steps.version.outputs.version }}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match pyproject.toml version ($package_version)."
            exit 1
          fi
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pyreact-framework-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release to PyPI
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master' &&
       inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyreact-framework/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyreact-framework-${{ needs.build.outputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
